
name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Generate activity graph
        uses: Ashutosh007/graphy@main
        with:
          username: fe-services-technologies

      - name: Commit generated graph
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update activity graph"
          add: "activity-graph.svg"
